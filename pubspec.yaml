name: trekguard_ai
description: "Trekking Support System with On-Device AI First-Aid & Offline Navigation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Architecture & Dependency Injection ───────────────────────────
  get_it: ^9.3.0
  injectable: ^3.0.0

  # ─── State Management ──────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

  # ─── Local Database (Offline-First) ────────────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # ─── Local Key-Value Cache ─────────────────────────────────────────
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2

  # ─── Routing ───────────────────────────────────────────────────────
  go_router: ^18.1.4

  # ─── Maps & GPS ────────────────────────────────────────────────────
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  flutter_compass: ^0.8.0

  # ─── AI On-Device (TFLite) ─────────────────────────────────────────
  tflite_flutter: ^0.12.1

  # ─── Generative AI — Gemini API (Online) ───────────────────────────
  google_generative_ai: ^0.4.6

  # ─── Speech Processing ─────────────────────────────────────────────
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2

  # ─── Cloud BaaS — Supabase ─────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ─── Networking ────────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.2

  # ─── Charts & Data Visualization ───────────────────────────────────
  fl_chart: ^1.3.1

  # ─── UI & Theming ──────────────────────────────────────────────────
  google_fonts: ^9.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^4.0.0
  cached_network_image: ^4.0.6
  photo_view: ^0.15.0

  # ─── Permissions & Device ──────────────────────────────────────────
  permission_handler: ^13.0.2
  path_provider: ^2.1.4
  battery_plus: ^7.1.2
  sensors_plus: ^7.1.1

  # ─── Utilities ─────────────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  rxdart: ^0.28.0
  logger: ^2.4.0
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  uuid: ^4.5.1

  # ─── Image & File Picker ───────────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Code Generation ───────────────────────────────────────────────
  build_runner: ^2.4.12
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  injectable_generator: ^3.1.3

  # ─── Testing ───────────────────────────────────────────────────────
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  fake_async: ^1.3.3

  # ─── Linting ───────────────────────────────────────────────────────
  flutter_lints: ^6.0.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/maps/
    - assets/images/
    - assets/icons/
    - assets/data/
  # fonts:
