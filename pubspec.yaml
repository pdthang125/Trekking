name: trekguard_ai
description: "Trekking Support System with On-Device AI First-Aid & Offline Navigation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Architecture & Dependency Injection ───────────────────────────
  get_it: ^7.7.0
  injectable: ^2.4.4

  # ─── State Management ──────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ─── Local Database (Offline-First) ────────────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.22

  # ─── Local Key-Value Cache ─────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.2

  # ─── Routing ───────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ─── Maps & GPS ────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^2.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0

  # ─── AI On-Device (TFLite) ─────────────────────────────────────────
  tflite_flutter: ^0.10.4

  # ─── Generative AI — Gemini API (Online) ───────────────────────────
  google_generative_ai: ^0.4.6

  # ─── Speech Processing ─────────────────────────────────────────────
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2

  # ─── Cloud BaaS — Supabase ─────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ─── Networking ────────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  internet_connection_checker_plus: ^2.5.0

  # ─── Charts & Data Visualization ───────────────────────────────────
  fl_chart: ^0.69.0

  # ─── UI & Theming ──────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # ─── Permissions & Device ──────────────────────────────────────────
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  battery_plus: ^6.0.3
  sensors_plus: ^5.0.1

  # ─── Utilities ─────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  rxdart: ^0.28.0
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  intl: ^0.19.0
  uuid: ^4.5.1

  # ─── Image & File Picker ───────────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Code Generation ───────────────────────────────────────────────
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  injectable_generator: ^2.6.2

  # ─── Testing ───────────────────────────────────────────────────────
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  fake_async: ^1.3.2

  # ─── Linting ───────────────────────────────────────────────────────
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/maps/
    - assets/images/
    - assets/icons/
    - assets/data/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
